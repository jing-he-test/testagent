apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: collection-email-agent
  version: 1.0.0
  description: AI agent that retrieves AR open items and payment history from S/4HANA and generates personalized collection email drafts using an LLM.

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: collection-email-agent
      kind: a2a
      ordId: sap.cadartifact:apiResource:collection-email-agent-12a67.collection-email-agent:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
