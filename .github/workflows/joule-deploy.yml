name: Deploy to Joule Studio
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package solution
        run: zip -r solution.zip assets solution.yaml

      - name: Import and deploy solution
        id: deploy
        env:
          OVERWRITE: ${{ inputs.force }}
          JOULE_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_TOKEN: ${{ secrets.JOULE_STUDIO_TOKEN }}
        run: |
          # Read existing solution_id from .build file if present
          SOLUTION_ID_HINT=""
          if [ -f ".build" ]; then
            SOLUTION_ID_HINT=$(grep "solution_id" .build | cut -d'=' -f2 | tr -d '[:space:]')
            echo "Existing solution_id: $SOLUTION_ID_HINT"
          fi

          # Build JSON payload with Python to avoid shell arg list limit
          python3 -c "
          import base64, json, os
          with open('solution.zip','rb') as f:
              z = base64.b64encode(f.read()).decode()
          payload = {
              'semanticVersion': 'main',
              'zip': z,
              'overwrite': os.environ['OVERWRITE'] == 'true'
          }
          hint = os.environ.get('SOLUTION_ID_HINT','').strip()
          if hint:
              payload['solutionId'] = hint
          with open('/tmp/import_payload.json','w') as f:
              json.dump(payload, f)
          print('Payload size:', len(z), 'chars', '| solutionId:', hint or 'new')
          "

          RESP=$(curl -s -X POST "$JOULE_HOST/solutions/importZip" \
            -H "Authorization: Bearer $JOULE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/import_payload.json)

          SOLUTION_ID=$(echo "$RESP" | jq -r '.solutionId // empty')
          if [ -z "$SOLUTION_ID" ]; then
            echo "Import failed: $RESP"
            echo "Token may have expired — run jl login and update JOULE_STUDIO_TOKEN secret"
            exit 1
          fi
          echo "solution_id=$SOLUTION_ID" >> $GITHUB_OUTPUT
          echo "Solution: $SOLUTION_ID"

          curl -s -X POST "$JOULE_HOST/solutions/$SOLUTION_ID/versions/main/deploy" \
            -H "Authorization: Bearer $JOULE_TOKEN" \
            -H "Content-Type: application/json" > /dev/null
          echo "Deploy triggered"

      - name: Poll deployment status
        env:
          JOULE_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_TOKEN: ${{ secrets.JOULE_STUDIO_TOKEN }}
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              "$JOULE_HOST/solutions/$SOLUTION_ID/versions/main/deploymentJobs" \
              -H "Authorization: Bearer $JOULE_TOKEN" \
              | jq -r '.value[0].status_code // "pending"')
            echo "[$i/60] $STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] || [ "$STATUS" = "timeout" ] && exit 1
            sleep 10
          done

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Solution ID: ${{ steps.deploy.outputs.solution_id }}" >> $GITHUB_STEP_SUMMARY
