name: Deploy to Joule Studio
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package solution
        run: zip -r solution.zip assets solution.yaml

      - name: Import and deploy solution
        id: deploy
        run: |
          OVERWRITE=${{ inputs.force }}

          # Build JSON with base64 zip using Python (avoids shell arg limit)
          python3 -c "
          import base64, json
          with open('solution.zip','rb') as f:
              z = base64.b64encode(f.read()).decode()
          payload = {'semanticVersion':'main','zip':z,'overwrite': ${{ inputs.force == 'true' }} }
          with open('/tmp/import_payload.json','w') as f:
              json.dump(payload, f)
          print('Payload size:', len(z), 'chars')
          "

          RESP=$(curl -s -X POST "${{ secrets.JOULE_STUDIO_HOST }}/solutions/importZip" \
            -H "Authorization: Bearer ${{ secrets.JOULE_STUDIO_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/import_payload.json)

          SOLUTION_ID=$(echo "$RESP" | jq -r '.solutionId // empty')
          if [ -z "$SOLUTION_ID" ]; then
            echo "Import failed: $RESP"
            echo "Token may have expired — run jl login and update JOULE_STUDIO_TOKEN secret"
            exit 1
          fi
          echo "solution_id=$SOLUTION_ID" >> $GITHUB_OUTPUT
          echo "Imported: $SOLUTION_ID"

          curl -s -X POST "${{ secrets.JOULE_STUDIO_HOST }}/solutions/$SOLUTION_ID/versions/main/deploy" \
            -H "Authorization: Bearer ${{ secrets.JOULE_STUDIO_TOKEN }}" \
            -H "Content-Type: application/json" > /dev/null
          echo "Deploy triggered"

      - name: Poll deployment status
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              "${{ secrets.JOULE_STUDIO_HOST }}/solutions/$SOLUTION_ID/versions/main/deploymentJobs" \
              -H "Authorization: Bearer ${{ secrets.JOULE_STUDIO_TOKEN }}" \
              | jq -r '.value[0].status_code // "pending"')
            echo "[$i/60] $STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] || [ "$STATUS" = "timeout" ] && exit 1
            sleep 10
          done

      - name: Summary
        if: success()
        run: echo "### Deployed ${{ steps.deploy.outputs.solution_id }}" >> $GITHUB_STEP_SUMMARY
