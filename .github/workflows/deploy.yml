name: Deploy to Joule Studio
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package solution
        run: |
          zip -r solution.zip assets solution.yaml .build
          echo "ZIP size: $(du -sh solution.zip | cut -f1)"

      - name: Import and deploy solution
        id: deploy
        env:
          OVERWRITE: ${{ inputs.force }}
          JOULE_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_TOKEN: ${{ secrets.JOULE_STUDIO_TOKEN }}
        run: |
          export SOLUTION_ID_HINT=""
          if [ -f ".build" ]; then
            export SOLUTION_ID_HINT=$(grep "solution_id" .build | cut -d'=' -f2 | tr -d '[:space:]')
            echo "Solution ID: $SOLUTION_ID_HINT"
          fi

          python3 -c "
          import base64, json, os
          with open('solution.zip','rb') as f:
              z = base64.b64encode(f.read()).decode()
          hint = os.environ.get('SOLUTION_ID_HINT','').strip()
          payload = {
              'semanticVersion': 'main',
              'zip': z,
              'overwrite': os.environ['OVERWRITE'] == 'true'
          }
          if hint:
              payload['solutionId'] = hint
          with open('/tmp/payload.json','w') as f:
              json.dump(payload, f)
          print('Payload:', len(z), 'chars | solutionId:', hint or 'NEW')
          "

          RESP=$(curl -s -X POST "$JOULE_HOST/solutions/importZip" \
            -H "Authorization: Bearer $JOULE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)

          SOLUTION_ID=$(echo "$RESP" | jq -r '.solutionId // empty')
          if [ -z "$SOLUTION_ID" ]; then
            echo "Import failed: $RESP"
            echo "Token may have expired — run jl login and re-sync from Joule Studio UI"
            exit 1
          fi
          echo "solution_id=$SOLUTION_ID" >> $GITHUB_OUTPUT
          echo "Imported: $SOLUTION_ID"

          DEPLOY_RESP=$(curl -s -X POST "$JOULE_HOST/solutions/$SOLUTION_ID/versions/main/deploy" \
            -H "Authorization: Bearer $JOULE_TOKEN" \
            -H "Content-Type: application/json")
          JOB_ID=$(echo "$DEPLOY_RESP" | jq -r '.ID // empty')
          if [ -z "$JOB_ID" ]; then
            echo "Deploy failed: $DEPLOY_RESP"
            exit 1
          fi
          echo "Job ID: $JOB_ID"

      - name: Poll deployment status
        env:
          JOULE_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_TOKEN: ${{ secrets.JOULE_STUDIO_TOKEN }}
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          START=$(date +%s)
          MAX_WAIT=2700
          INTERVAL=30
          echo "Polling every ${INTERVAL}s, max wait ${MAX_WAIT}s (~45 min)..."
          while true; do
            ELAPSED=$(( $(date +%s) - START ))
            RESP=$(curl -s \
              "$JOULE_HOST/solutions/$SOLUTION_ID/versions/main/deploymentJobs" \
              -H "Authorization: Bearer $JOULE_TOKEN")
            STATUS=$(echo "$RESP" | jq -r '.value[0].status_code // "pending"')
            printf "[%3ds] Status: %s\n" "$ELAPSED" "$STATUS"
            [ "$STATUS" = "completed" ] && echo "Deployment succeeded!" && break
            [ "$STATUS" = "failed" ]   && echo "Deployment failed!"    && exit 1
            [ "$STATUS" = "timeout" ]  && echo "Deployment timed out!" && exit 1
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Polling timed out after ${MAX_WAIT}s — last status: $STATUS"
              exit 1
            fi
            sleep $INTERVAL
          done

      - name: Summary
        if: success()
        run: echo "### Deployed ${{ steps.deploy.outputs.solution_id }}" >> $GITHUB_STEP_SUMMARY
