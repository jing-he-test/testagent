name: Deploy to Joule Studio

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing solution deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  secrets: write        # needed to rotate JOULE_STUDIO_REFRESH_TOKEN

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Exchange refresh token → access token, rotate refresh token ──
      - name: Get IAS access token and rotate refresh token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.JOULE_STUDIO_IAS_URL }}/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.JOULE_STUDIO_REFRESH_TOKEN }}" \
            -d "client_id=${{ secrets.JOULE_STUDIO_CLIENT_ID }}" \
            -d "app_tid=${{ secrets.JOULE_STUDIO_APP_TID }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.weak_access_token // .access_token // empty')
          NEW_REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error_description // .error // "unknown"')
            echo "❌ Failed to get access token: $ERROR"
            echo "   Re-sync with GitHub from Joule Studio UI to get a fresh refresh token."
            exit 1
          fi
          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Access token obtained"

          # Rotate refresh token immediately — IAS tokens are single-use
          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            pip install PyNaCl -q
            KEY_DATA=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key")
            KEY_ID=$(echo "$KEY_DATA" | jq -r '.key_id')
            PUBKEY=$(echo "$KEY_DATA" | jq -r '.key')
            ENCRYPTED=$(python3 - <<EOF
import base64, nacl.public
pk = nacl.public.PublicKey(base64.b64decode("$PUBKEY"))
box = nacl.public.SealedBox(pk)
print(base64.b64encode(box.encrypt(b"$NEW_REFRESH_TOKEN")).decode())
EOF
)
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/JOULE_STUDIO_REFRESH_TOKEN" \
              -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}" > /dev/null
            echo "✅ Refresh token rotated for next run"
          fi

      # ── Step 2: Package solution ZIP ─────────────────────────────────────────
      - name: Package solution
        id: package
        run: |
          zip -r solution.zip assets solution.yaml -x "*.git*"
          echo "✅ Packaged $(du -sh solution.zip | cut -f1) ZIP"

      # ── Step 3: Import ZIP → creates/updates solution ────────────────────────
      - name: Import solution
        id: import
        run: |
          ZIP_B64=$(base64 -w0 solution.zip)
          OVERWRITE=${{ inputs.force }}

          RESPONSE=$(curl -s -X POST \
            "${{ secrets.JOULE_STUDIO_HOST }}/solutions/importZip" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"semanticVersion\":\"main\",\"zip\":\"$ZIP_B64\",\"overwrite\":$OVERWRITE}")

          SOLUTION_ID=$(echo "$RESPONSE" | jq -r '.solutionId // empty')
          ERRORS=$(echo "$RESPONSE" | jq -r '.errors // [] | length')

          if [ -z "$SOLUTION_ID" ]; then
            echo "❌ Import failed: $(echo "$RESPONSE" | jq -r '.error // .message // .')"
            exit 1
          fi
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Import rejected files: $(echo "$RESPONSE" | jq -r '.errors')"
            exit 1
          fi

          echo "solution_id=$SOLUTION_ID" >> $GITHUB_OUTPUT
          echo "✅ Solution imported: $SOLUTION_ID"

      # ── Step 4: Trigger deployment ────────────────────────────────────────────
      - name: Deploy solution
        run: |
          SOLUTION_ID="${{ steps.import.outputs.solution_id }}"

          RESPONSE=$(curl -s -X POST \
            "${{ secrets.JOULE_STUDIO_HOST }}/solutions/$SOLUTION_ID/versions/main/deploy" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json")

          JOB_ID=$(echo "$RESPONSE" | jq -r '.ID // empty')
          if [ -z "$JOB_ID" ]; then
            echo "❌ Deploy failed: $(echo "$RESPONSE" | jq -r '.error // .message // .')"
            exit 1
          fi
          echo "✅ Deployment triggered, job: $JOB_ID"

      # ── Step 5: Poll deployment status ───────────────────────────────────────
      - name: Wait for deployment to complete
        run: |
          SOLUTION_ID="${{ steps.import.outputs.solution_id }}"
          echo "Polling deployment status..."

          for i in $(seq 1 60); do
            RESPONSE=$(curl -s \
              "${{ secrets.JOULE_STUDIO_HOST }}/solutions/$SOLUTION_ID/versions/main/deploymentJobs" \
              -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

            STATUS=$(echo "$RESPONSE" | jq -r '.value[0].status_code // "pending"')
            echo "  [$i/60] Status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "✅ Deployment completed"
              break
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "timeout" ]; then
              LOGS=$(echo "$RESPONSE" | jq -r '.value[0].logs // ""')
              echo "❌ Deployment $STATUS: $LOGS"
              exit 1
            fi

            sleep 10
          done

      # ── Step 6: Summary ───────────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          SOLUTION_ID="${{ steps.import.outputs.solution_id }}"
          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution** | \`ap-invoice-automation-91768\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution ID** | \`$SOLUTION_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Host** | \`${{ secrets.JOULE_STUDIO_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
# trigger re-evaluation
