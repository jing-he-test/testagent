name: Deploy to Joule Studio

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing solution deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  secrets: write        # needed to rotate JOULE_STUDIO_REFRESH_TOKEN

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Exchange refresh token → access token, rotate refresh token ──
      # IAS refresh tokens are single-use. Each exchange returns a NEW refresh
      # token. We immediately write it back to GitHub Secrets so the next run works.
      - name: Get IAS access token and rotate refresh token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.JOULE_STUDIO_IAS_URL }}/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.JOULE_STUDIO_REFRESH_TOKEN }}" \
            -d "client_id=${{ secrets.JOULE_STUDIO_CLIENT_ID }}" \
            -d "app_tid=${{ secrets.JOULE_STUDIO_APP_TID }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.weak_access_token // .access_token // empty')
          NEW_REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            ERROR=$(echo "$RESPONSE" | jq -r '.error_description // .error // "unknown"')
            echo "❌ Failed to get access token: $ERROR"
            echo "   Re-sync with GitHub from Joule Studio UI to get a fresh refresh token."
            exit 1
          fi

          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Access token obtained"

          # Rotate the refresh token immediately so the next run works
          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            pip install PyNaCl -q
            KEY_DATA=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key")
            KEY_ID=$(echo "$KEY_DATA" | jq -r '.key_id')
            PUBKEY=$(echo "$KEY_DATA" | jq -r '.key')

            ENCRYPTED=$(python3 - <<EOF
import base64, nacl.public, nacl.encoding
pk = nacl.public.PublicKey(base64.b64decode("$PUBKEY"))
box = nacl.public.SealedBox(pk)
encrypted = box.encrypt(b"$NEW_REFRESH_TOKEN")
print(base64.b64encode(encrypted).decode())
EOF
)
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/JOULE_STUDIO_REFRESH_TOKEN" \
              -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}" > /dev/null
            echo "✅ Refresh token rotated for next run"
          fi

      # ── Step 2: Install Joule Studio CLI ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Joule Studio CLI
        run: |
          npm install -g @sap/joule-work-dev-cli-early-adopters \
            --registry https://int.repositories.cloud.sap/artifactory/api/npm/build-milestones-npm/ \
            --silent
          echo "✅ CLI installed: $(jl --version)"

      # ── Step 3: Build & Deploy ────────────────────────────────────────────────
      - name: Build and deploy solution
        id: deploy
        env:
          JOULE_STUDIO_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_STUDIO_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          jl solution build
          jl solution deploy $FORCE_FLAG

          SOLUTION_ID=$(cat .build | jq -r '.solution_id // empty')
          if [ -z "$SOLUTION_ID" ]; then
            echo "❌ Could not read solution_id from .build file"
            exit 1
          fi
          echo "solution_id=$SOLUTION_ID" >> $GITHUB_OUTPUT
          echo "✅ Solution deployed: $SOLUTION_ID"

      # ── Step 4: Poll deployment status ───────────────────────────────────────
      - name: Wait for deployment to complete
        env:
          JOULE_STUDIO_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_STUDIO_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          echo "Polling deployment status for solution $SOLUTION_ID..."

          for i in $(seq 1 60); do
            RESPONSE=$(curl -s \
              "${{ secrets.JOULE_STUDIO_HOST }}/solutions/$SOLUTION_ID/versions/main/deploymentJobs" \
              -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

            STATUS=$(echo "$RESPONSE" | jq -r '.value[0].status_code // "pending"')
            echo "  [$i/60] Status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "✅ Deployment completed"
              break
            fi

            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "timeout" ]; then
              echo "❌ Deployment $STATUS"
              exit 1
            fi

            sleep 10
          done

      # ── Step 5: Summary ───────────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          ENGAGEMENT_LAYER="${{ secrets.JOULE_STUDIO_ENGAGEMENT_LAYER_URL }}"

          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution** | \`ap-invoice-automation-91768\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution ID** | \`$SOLUTION_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | staging |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$ENGAGEMENT_LAYER" ]; then
            echo "| **View** | [$ENGAGEMENT_LAYER/new/build/overview/solutions/$SOLUTION_ID]($ENGAGEMENT_LAYER/new/build/overview/solutions/$SOLUTION_ID) |" >> $GITHUB_STEP_SUMMARY
          fi
