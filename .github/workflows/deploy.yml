name: Deploy to Joule Studio

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing solution deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Exchange refresh token for a fresh IAS access token ──────────
      - name: Get IAS access token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.JOULE_STUDIO_IAS_URL }}/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.JOULE_STUDIO_REFRESH_TOKEN }}" \
            -d "client_id=${{ secrets.JOULE_STUDIO_CLIENT_ID }}" \
            -d "app_tid=${{ secrets.JOULE_STUDIO_APP_TID }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.weak_access_token // .access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "❌ Failed to get access token. Refresh token may have expired."
            echo "   Run: jl login <your-login-url>  then update JOULE_STUDIO_REFRESH_TOKEN secret."
            exit 1
          fi

          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Access token obtained"

      # ── Step 2: Install Joule Studio CLI ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Joule Studio CLI
        run: |
          npm install -g @sap/joule-work-dev-cli-early-adopters \
            --registry https://int.repositories.cloud.sap/artifactory/api/npm/build-milestones-npm/ \
            --silent
          echo "✅ CLI installed: $(jl --version)"

      # ── Step 3: Build & Deploy ────────────────────────────────────────────────
      - name: Build and deploy solution
        id: deploy
        env:
          JOULE_STUDIO_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_STUDIO_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          jl solution build
          jl solution deploy $FORCE_FLAG

          SOLUTION_ID=$(cat .build | jq -r '.solution_id // empty')
          if [ -z "$SOLUTION_ID" ]; then
            echo "❌ Could not read solution_id from .build file"
            exit 1
          fi
          echo "solution_id=$SOLUTION_ID" >> $GITHUB_OUTPUT
          echo "✅ Solution deployed: $SOLUTION_ID"

      # ── Step 4: Poll deployment status ───────────────────────────────────────
      - name: Wait for deployment to complete
        env:
          JOULE_STUDIO_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_STUDIO_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          echo "Polling deployment status for solution $SOLUTION_ID..."

          for i in $(seq 1 60); do
            RESPONSE=$(curl -s \
              "${{ secrets.JOULE_STUDIO_HOST }}/solutions/$SOLUTION_ID/versions/main/deploymentJobs" \
              -H "Authorization: Bearer ${{ steps.auth.outputs.token }}")

            STATUS=$(echo "$RESPONSE" | jq -r '.value[0].status_code // "pending"')
            echo "  [$i/60] Status: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "✅ Deployment completed"
              break
            fi

            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "timeout" ]; then
              echo "❌ Deployment $STATUS"
              exit 1
            fi

            sleep 10
          done

      # ── Step 5: Summary ───────────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          SOLUTION_ID="${{ steps.deploy.outputs.solution_id }}"
          ENGAGEMENT_LAYER="${{ secrets.JOULE_STUDIO_ENGAGEMENT_LAYER_URL }}"

          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution** | \`ap-invoice-automation-91768\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Solution ID** | \`$SOLUTION_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | staging |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$ENGAGEMENT_LAYER" ]; then
            echo "| **View** | [$ENGAGEMENT_LAYER/new/build/overview/solutions/$SOLUTION_ID]($ENGAGEMENT_LAYER/new/build/overview/solutions/$SOLUTION_ID) |" >> $GITHUB_STEP_SUMMARY
          fi
